name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller BTCRechnung.spec

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BTCRechnung -DestinationPath BTCRechnung-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCRechnung-windows
          path: BTCRechnung-windows.zip

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build binary with PyInstaller
        run: |
          pyinstaller BTCRechnung.spec

      - name: Tarball build
        run: |
          tar -czf BTCRechnung-linux.tar.gz -C dist BTCRechnung

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCRechnung-linux
          path: BTCRechnung-linux.tar.gz

  github-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: BTCRechnung-windows
          path: release-assets

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: BTCRechnung-linux
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
